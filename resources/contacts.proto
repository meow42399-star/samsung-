  // Users can either choose a preset type from a drop down (Work, Home, ...) or
  // set a custom type. Custom types don't need to be localized.
  oneof contact_type {
    // A pre-defined contact type.
    Preset preset_type = 1;
    // A custom contact type.
    string custom_type = 2;
  }
}

// Represents a date associated with a contact other than their birthday.
message ContactOtherDate {
  // The date is stored as a timestamp in milliseconds since epoch in GMT.
  ContactDate other_date = 1;
  // The type of the date.
  ContactType contact_type = 2;
}

// A date with a year, month and day.
message ContactDate {
  // A contact can have dates without a year specified. E.g. a user might only
  // know the month and day of a contact's birthday.
  uint32 year = 1;
  // The month of the date.
  uint32 month = 2;
  // The day of the date.
  uint32 day = 3;
  // The type of the calendar the date is using.
  ContactCalendarType calendar_type = 4;
}

enum ContactCalendarType {
  CONTACT_CALENDAR_TYPE_UNSPECIFIED = 0;
  CONTACT_CALENDAR_TYPE_GREGORIAN = 1;
  // Indicates lunisolar calendar used in East Asia.
  CONTACT_CALENDAR_TYPE_LUNISOLAR = 2;
}

// Represents a phone number for a contact.
message ContactTelephoneNumber {
  // A phone number.
  string phone_number = 1;
  // The type of the phone number.
  ContactType contact_type = 2;
}

// Represents a website entry for a contact.
message ContactWebsite {
  // A URL.
  string url = 1;
  // The type of the URL.
  ContactType contact_type = 2;
}

// Represents a street address for a contact.
message ContactAddress {
  // A street address.
  // E.g. [4 Mildmay Street, Flat 14]
  repeated string address = 1;
  // The city of the address.
  string city = 2;
  // The state of the address.
  string state = 3;
  // The zip code of the address.
  string zip = 4;
  // The country of the address.
  string country = 5;
  // The type of the address.
  ContactType contact_type = 6;
}

// Represents a relationship between contacts.
message ContactRelated {
  // The name of the related contact.
  // E.g. "John Doe"
  string name = 1;
  // The type of the relationship.
  ContactType contact_type = 2;
}

// Represents the source of a contact entry.
message ContactSource {
  // The account name of the contact source.
  // E.g. xyz@gmail.com
  string account_name = 1;
  // The account type of the contact source.
  // E.g. com.google
  string account_type = 2;
  // The data set of the contact source.
  // One account might have different data sets e.g. for work and home. See
  // https://developer.android.com/reference/android/provider/ContactsContract.RawContactsColumns#DATA_SET
  string data_set = 3;
}

// Represents a social media profile for a contact.
message ContactSocialMedia {
  // The social media service.
  string service = 1;
  // String representation of the social media profile.
  string profile = 2;
}

// Represents metadata associated with a contact photo.
message ContactPhotoMetadata {
  // The contact ID associated with the photo.
  string contact_id = 1;
  FileContentIdentifier content_identifier = 2;
  ExportFailure export_failure = 3;
}

// Represents the response expected when fetching or receiving contacts.
message ContactArray {
  // An array of contacts.
  repeated Contact contacts = 1;
  ExportFailureSummary export_failure_summary = 2;
}
