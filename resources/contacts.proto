edition = "2023";

package os_migration_data_types.v1;

import "export_failure.proto";
import "file_content.proto";

option java_multiple_files = true;

// Represents a contact stored on device.
message Contact {
  // Unique identifier for the contact. Stays stable across multiple migrations.
  string contact_id = 1;
  // The first name of the contact.
  string first_name = 2;
  // The middle name of the contact.
  string middle_name = 3;
  // The last name of the contact.
  string last_name = 4;
  // The prefix of the contact's name.
  string name_prefix = 5;
  // The suffix of the contact's name.
  string name_suffix = 6;
  // The nickname of the contact.
  string nickname = 7;
  // The maiden name of the contact.
  string maiden_name = 8;
  // The phonetic version of the first name.
  string phonetic_first_name = 9;
  // The phonetic version of the middle name.
  string phonetic_middle_name = 10;
  // The phonetic version of the last name.
  string phonetic_last_name = 11;
  // The contact's organization.
  ContactOrganization organization = 12;
  // The contact's email addresses.
  repeated ContactEmail email = 13;
  // The birthday is stored as a timestamp in milliseconds since epoch in GMT.
  ContactDate birthday_date = 14;
  // Other dates associated with the contact.
  repeated ContactOtherDate other_date = 15;
  // The contact's telephone numbers.
  repeated ContactTelephoneNumber telephone_number = 16;
  // A note about the contact.
  string note = 17;
  // The contact's website URLs.
  repeated ContactWebsite url = 18;
  // The contact's addresses.
  repeated ContactAddress address = 19;
  // Related contacts.
  repeated ContactRelated related = 20;
  // Indicates if the contact is a favorite.
  bool is_favorite = 21;
  // The source of the contact.
  ContactSource source = 22;
  // The contact's social media profiles.
  repeated ContactSocialMedia social_media = 23;
  // Uniquely identifies the contact on the server side. Will be populated where
  // available.
  string source_id = 24;
  bool is_local = 25;
}

// Represents the organization information of a contact.
message ContactOrganization {
  // The name of the company.
  string company = 1;
  // The department of the contact within the company.
  string department = 2;
  // The contact's job title.
  string job_title = 3;
  // The phonetic version of the organization's name.
  string phonetic_name = 4;
}

// Represents an email address for a contact.
message ContactEmail {
  // The email address.
  string email = 1;
  // The type of the email address.
  ContactType contact_type = 2;
}

